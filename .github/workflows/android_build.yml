name: Build Android APK
on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Fixes the Node.js 24 warning for 2026
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      # Prevents scripts from hanging/waiting for user input
      CI: true
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install Bubblewrap and Setup
        run: |
          npm install -g @bubblewrap/cli
          # Pre-create the directory for icons to avoid path errors
          mkdir -p output

      - name: Create TWA Config
        run: |
          echo '{
            "packageId": "com.kittu.pawfect",
            "host": "pawfect-doc-ai.streamlit.app",
            "name": "Pawfect Vet AI",
            "themeColor": "#C0392B",
            "navigationColor": "#0E1117",
            "startUrl": "/",
            "iconUrl": "https://cdn-icons-png.flaticon.com/512/194/194279.png",
            "maskableIconUrl": "https://cdn-icons-png.flaticon.com/512/194/194279.png",
            "clockwiseIconUrl": "https://cdn-icons-png.flaticon.com/512/194/194279.png",
            "shortcuts": [],
            "generatorApp": "bubblewrap-cli"
          }' > twa-manifest.json

      - name: Build APK
        # The 'yes' pipe handles any hidden license prompts that cause Code 130
        run: |
          yes | bubblewrap build --skipSigning
        
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Pawfect-Vet-App
          path: ./*.apk
