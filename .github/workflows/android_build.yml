name: Build Android APK
on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Bubblewrap
        run: npm install -g @bubblewrap/cli

      - name: Manual SDK Setup
        # We download the specific cmdline-tools Bubblewrap expects
        run: |
          mkdir -p $HOME/android-sdk/cmdline-tools
          wget https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip -O tools.zip
          unzip tools.zip -d $HOME/android-sdk/cmdline-tools
          mv $HOME/android-sdk/cmdline-tools/cmdline-tools $HOME/android-sdk/cmdline-tools/latest
          
          mkdir -p ~/.bubblewrap
          echo "{\"jdkPath\":\"${JAVA_HOME}\",\"androidSdkPath\":\"$HOME/android-sdk\"}" > ~/.bubblewrap/config.json

      - name: Create TWA Config
        run: |
          echo '{
            "packageId": "com.kittu.pawfect",
            "host": "pawfect-doc-ai.streamlit.app",
            "name": "Pawfect Vet AI",
            "themeColor": "#C0392B",
            "navigationColor": "#0E1117",
            "startUrl": "/",
            "iconUrl": "https://cdn-icons-png.flaticon.com/512/194/194279.png",
            "maskableIconUrl": "https://cdn-icons-png.flaticon.com/512/194/194279.png",
            "clockwiseIconUrl": "https://cdn-icons-png.flaticon.com/512/194/194279.png",
            "shortcuts": [],
            "generatorApp": "bubblewrap-cli"
          }' > twa-manifest.json

      - name: Build APK
        run: |
          # The 'yes' pipe handles the license prompts for the new SDK
          yes | bubblewrap build --skipSigning
        
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Pawfect-Vet-App
          path: ./*.apk
