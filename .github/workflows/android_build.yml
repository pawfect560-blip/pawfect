name: Build Android APK
on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20 # Switching to 20 for better stability with Bubblewrap CLI

      - name: Install Bubblewrap
        run: npm install -g @bubblewrap/cli

      - name: Manual Config Injection
        # We are creating the hidden folder and writing the JSON manually. 
        # This prevents the "Do you want to install JDK?" prompt from ever appearing.
        run: |
          mkdir -p ~/.bubblewrap
          echo "{\"jdkPath\":\"${JAVA_HOME}\",\"androidSdkPath\":\"${ANDROID_SDK_ROOT}\"}" > ~/.bubblewrap/config.json
          cat ~/.bubblewrap/config.json

      - name: Create TWA Config
        run: |
          echo '{
            "packageId": "com.kittu.pawfect",
            "host": "pawfect-doc-ai.streamlit.app",
            "name": "Pawfect Vet AI",
            "themeColor": "#C0392B",
            "navigationColor": "#0E1117",
            "startUrl": "/",
            "iconUrl": "https://cdn-icons-png.flaticon.com/512/194/194279.png",
            "maskableIconUrl": "https://cdn-icons-png.flaticon.com/512/194/194279.png",
            "clockwiseIconUrl": "https://cdn-icons-png.flaticon.com/512/194/194279.png",
            "shortcuts": [],
            "generatorApp": "bubblewrap-cli"
          }' > twa-manifest.json

      - name: Build APK
        # --yes is crucial here to accept the Android SDK licenses automatically
        run: |
          bubblewrap build --skipSigning --yes
        
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Pawfect-Vet-App
          path: ./*.apk
