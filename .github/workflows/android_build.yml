name: Build Android APK
on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Bubblewrap
        run: npm install -g @bubblewrap/cli

      - name: Fix Android SDK Pathing
        # Bubblewrap specifically looks for 'cmdline-tools/latest'
        # We create a symlink to make the existing SDK match that format
        run: |
          sudo mkdir -p /usr/local/lib/android/sdk/cmdline-tools/latest
          sudo ln -sf /usr/local/lib/android/sdk/cmdline-tools/tools/* /usr/local/lib/android/sdk/cmdline-tools/latest/ || true
          
          mkdir -p ~/.bubblewrap
          echo "{\"jdkPath\":\"${JAVA_HOME}\",\"androidSdkPath\":\"/usr/local/lib/android/sdk\"}" > ~/.bubblewrap/config.json

      - name: Create TWA Config
        run: |
          echo '{
            "packageId": "com.kittu.pawfect",
            "host": "pawfect-doc-ai.streamlit.app",
            "name": "Pawfect Vet AI",
            "themeColor": "#C0392B",
            "navigationColor": "#0E1117",
            "startUrl": "/",
            "iconUrl": "https://cdn-icons-png.flaticon.com/512/194/194279.png",
            "maskableIconUrl": "https://cdn-icons-png.flaticon.com/512/194/194279.png",
            "clockwiseIconUrl": "https://cdn-icons-png.flaticon.com/512/194/194279.png",
            "shortcuts": [],
            "generatorApp": "bubblewrap-cli"
          }' > twa-manifest.json

      - name: Build APK
        # We use --yes instead of 'yes |' to prevent the Broken Pipe error
        run: |
          bubblewrap build --skipSigning --yes
