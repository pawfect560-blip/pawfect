name: Build Android APK
on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4  # Updated to v4

      - name: Set up Node.js
        uses: actions/setup-node@v4  # Updated to v4
        with:
          node-version: 20  # Using a newer Node version for 2026 compatibility

      - name: Install Bubblewrap
        run: npm install -g @bubblewrap/cli

      - name: Create TWA Config
        run: |
          echo '{
            "packageId": "com.kittu.pawfect",
            "host": "pawfect-doc-ai.streamlit.app",
            "name": "Pawfect Vet AI",
            "themeColor": "#C0392B",
            "navigationColor": "#0E1117",
            "startUrl": "/",
            "iconUrl": "https://cdn-icons-png.flaticon.com/512/194/194279.png",
            "maskableIconUrl": "https://cdn-icons-png.flaticon.com/512/194/194279.png",
            "clockwiseIconUrl": "https://cdn-icons-png.flaticon.com/512/194/194279.png",
            "shortcuts": [],
            "generatorApp": "bubblewrap-cli"
          }' > twa-manifest.json

      - name: Build APK
        # Accepting terms automatically
        run: |
          bubblewrap build --skipSigning --yes
        
      - name: Upload APK
        uses: actions/upload-artifact@v4  # Updated to v4
        with:
          name: Pawfect-Vet-App
          path: ./*.apk
