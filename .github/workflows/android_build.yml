name: Build Android APK
on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install Bubblewrap
        run: npm install -g @bubblewrap/cli

      - name: Pre-configure Bubblewrap
        # This tells Bubblewrap exactly where Java and Android SDK are
        # so it NEVER asks the "Do you want to install JDK" question.
        run: |
          mkdir -p ~/.bubblewrap
          echo '{
            "jdkPath": "'$JAVA_HOME'",
            "androidSdkPath": "'$ANDROID_SDK_ROOT'"
          }' > ~/.bubblewrap/config.json

      - name: Create TWA Config
        run: |
          echo '{
            "packageId": "com.kittu.pawfect",
            "host": "pawfect-doc-ai.streamlit.app",
            "name": "Pawfect Vet AI",
            "themeColor": "#C0392B",
            "navigationColor": "#0E1117",
            "startUrl": "/",
            "iconUrl": "https://cdn-icons-png.flaticon.com/512/194/194279.png",
            "maskableIconUrl": "https://cdn-icons-png.flaticon.com/512/194/194279.png",
            "clockwiseIconUrl": "https://cdn-icons-png.flaticon.com/512/194/194279.png",
            "shortcuts": [],
            "generatorApp": "bubblewrap-cli"
          }' > twa-manifest.json

      - name: Build APK
        # No more prompts! It sees the config and just builds.
        run: |
          bubblewrap build --skipSigning --yes
        
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Pawfect-Vet-App
          path: ./*.apk
